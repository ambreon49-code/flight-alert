name: flight-alert

on:
  schedule:
    - cron: "*/15 * * * *"   # 15分ごと（GitHub側の混雑で数分遅れることがあります）
  workflow_dispatch:          # 手動実行ボタン

permissions:
  contents: write             # 記録ファイル state.json を保存するため

concurrency:
  group: flight-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15       # API 呼び出し約100回 ＋ Google Flights の確認が最大40回
    steps:
      - uses: actions/checkout@v4

      - name: プログラムを用意
        run: |
          cat > check_flights.py <<'PYEOF'
          #!/usr/bin/env python3
          """羽田・成田（東京 TYO）発の格安往復航空券を探して Discord に通知する。

          GitHub Actions から定期実行する前提。外部ライブラリ不要（標準ライブラリのみ）。
          必要な環境変数:
            TRAVELPAYOUTS_TOKEN  … Travelpayouts の API トークン
            DISCORD_WEBHOOK_URL  … 通知先の Discord Webhook URL
          """
          import base64
          import json
          import re
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone

          # ===== 設定（ここを変えれば条件を調整できます） =====
          ORIGIN = "TYO"                 # 東京（羽田 HND + 成田 NRT）。金額は東京から出発する前提で比べる
          # 地方発も探す。判定は「東京→その空港の国内線（最安）＋その空港発の運賃」の合計で行う。
          REGIONAL = "SPK AKJ NGO OSA FUK OKA".split()  # 札幌・旭川・名古屋・大阪・福岡・沖縄
          ONE_WAY_RATE = 0.6             # 片道の激安ライン = 往復のライン × この割合
          MONTHS_AHEAD = 6               # 何か月先の出発まで探すか
          # 往復この金額以下なら通知（国コード別）。LCCの通常運賃ではなく、セール・エラー運賃の水準。
          EUROPE = "GB FR DE IT ES PT NL BE AT CH CZ PL HU GR DK SE NO FI IE HR TR".split()
          PRICE_CAPS = {
              "JP": 8000,
              "KR": 15000,
              "TW": 20000, "HK": 20000, "MO": 20000,
              "CN": 30000, "GU": 30000, "MP": 30000,
              **{cc: 35000 for cc in "TH VN PH SG MY ID KH".split()},
              "AU": 60000,
              "US": 70000, "CA": 70000, "NZ": 70000,
              **{cc: 75000 for cc in EUROPE},
          }
          HAWAII = {"HNL", "OGG", "KOA", "LIH", "ITO"}
          HAWAII_CAP = 50000
          BASELINE_RATE = 0.40           # 普段の最安値（過去30日の日別最安の中央値）より40%以上安ければ通知
          BASELINE_MIN_DAYS = 7          # 普段の最安値を出すのに必要な日数
          MAX_NOTIFY = 10                # 1回の実行で通知する最大件数
          RENOTIFY_DAYS = 7              # 同じ便は7日間再通知しない（さらに5%以上下がった場合を除く）
          RENOTIFY_DROP = 0.05
          HISTORY_DAYS = 30              # 価格履歴を何日分保持するか
          # Google Flights でも同じ日付の価格を調べ、安い方で判定・通知する（Aviasales は旅行サイトの手数料込みや古い価格が多い）
          GF_ENABLED = True
          GF_MARGIN = 1.3                # Aviasales の価格が通知ラインの何倍までなら Google Flights で調べるか（少し高い便も Google では届くことがある）
          GF_TOP_DATES = 3               # 行先ごとに、安い日付を上から何件調べるか
          GF_MAX_FETCH = 40              # 1回の実行で Google Flights を開く最大回数（1回 約2秒）
          GF_CACHE_HOURS = 6             # 同じ便・同じ日付を調べ直すまでの時間
          GF_STALE_RATE = 1.3            # Google Flights がこの倍率より高ければ「Aviasales の価格は古いかも」と注意を付ける
          SALE_FEED = "https://www.traicy.com/category/sale/feed"  # トライシーの「セール・特別運賃」記事
          SALE_NEED_PRICE = True         # 金額（○円）が書かれたセール記事だけ通知する
          SALE_KEEP_DAYS = 60            # 通知済み記事を何日覚えておくか
          # 海外のエラー運賃・激安情報（Travel-Dealz）。日本発の記事だけ通知する
          DEAL_FEED = "https://travel-dealz.com/category/flights/feed/"
          JP_PLACES = r"(Tokyo|Haneda|Narita|Japan|Osaka|Kansai|Nagoya|Fukuoka|Sapporo|Okinawa|Naha)"
          DEAL_JP_RE = re.compile(rf"\b(from|ex)\s+{JP_PLACES}\b|\b{JP_PLACES}\b[^:]*↔|↔\s*{JP_PLACES}\b", re.I)  # 「from Tokyo」「Tokyo ↔ ○○」
          DEAL_HOT_RE = re.compile(r"error fare|mistake fare|glitch|\bbug\b", re.I)  # これが付いていたら目印を付ける
          # ===================================================

          API_URL = "https://api.travelpayouts.com/aviasales/v3/prices_for_dates"
          LATEST_URL = "https://api.travelpayouts.com/v2/prices/latest"
          DATA_URL = "https://api.travelpayouts.com/data/{lang}/{kind}.json"
          STATE_FILE = os.path.join(os.path.dirname(os.path.abspath(__file__)), "state.json")
          JST = timezone(timedelta(hours=9))


          def http_get_json(url, headers=None, timeout=30):
              req = urllib.request.Request(url, headers={"User-Agent": "flight-alert/1.0", **(headers or {})})
              with urllib.request.urlopen(req, timeout=timeout) as res:
                  return json.loads(res.read().decode("utf-8"))


          def load_names():
              """都市コード → (都市名, 国コード)、国コード → 国名 の辞書を作る。失敗してもコードのまま動く。"""
              cities, countries = {}, {}
              for lang in ("ja", "en"):
                  try:
                      for c in http_get_json(DATA_URL.format(lang=lang, kind="cities")):
                          code = c.get("code")
                          if code and code not in cities:
                              cities[code] = (c.get("name") or code, c.get("country_code") or "")
                      for c in http_get_json(DATA_URL.format(lang=lang, kind="countries")):
                          code = c.get("code")
                          if code and code not in countries:
                              countries[code] = c.get("name") or code
                      if cities:
                          break
                  except Exception as e:  # 名前データは無くても動作に支障なし
                      print(f"[warn] 名前データ({lang})の取得に失敗: {e}")
              return cities, countries


          def fetch_prices(token, origin, one_way):
              """今月から MONTHS_AHEAD か月分、origin 発・全行先の往復（one_way なら片道）の価格を取得する。"""
              results = []
              today = datetime.now(JST).date()
              y, m = today.year, today.month
              for _ in range(MONTHS_AHEAD):
                  params = {
                      "origin": origin,
                      "departure_at": f"{y:04d}-{m:02d}",
                      "one_way": "true" if one_way else "false",
                      "currency": "jpy",
                      "market": "jp",
                      "sorting": "price",
                      "limit": "1000",
                  }
                  url = API_URL + "?" + urllib.parse.urlencode(params)
                  data = http_get_json(url, headers={"X-Access-Token": token})
                  if not data.get("success"):
                      raise RuntimeError(f"API エラー: {data.get('error')}")
                  for it in data.get("data") or []:
                      it["_origin"], it["_ow"] = origin, one_way
                      results.append(it)
                  m += 1
                  if m > 12:
                      y, m = y + 1, 1
                  time.sleep(0.5)
              return results


          def fetch_latest(token, origin, one_way):
              """直近48時間に Aviasales で検索された origin 発の価格を取得し、fetch_prices と同じ形に揃える。"""
              params = {
                  "origin": origin,
                  "currency": "jpy",
                  "period_type": "year",
                  "one_way": "true" if one_way else "false",
                  "show_to_affiliates": "false",   # 提携リンク経由以外の検索結果も含める
                  "sorting": "price",
                  "limit": "1000",
              }
              data = http_get_json(LATEST_URL + "?" + urllib.parse.urlencode(params), headers={"X-Access-Token": token})
              if not data.get("success"):
                  raise RuntimeError(f"API エラー: {data.get('error')}")
              items = []
              for d in data.get("data") or []:
                  if d.get("trip_class") not in (0, None) or bool(d.get("return_date")) == one_way:
                      continue
                  items.append({
                      "destination": d.get("destination"),
                      "price": d.get("value"),
                      "departure_at": d.get("depart_date"),
                      "return_at": d.get("return_date"),
                      "transfers": d.get("number_of_changes"),
                      "_origin": origin,
                      "_ow": one_way,
                  })
              return items


          GF_URL = "https://www.google.com/travel/flights"
          GF_HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36",
              "Accept-Language": "ja,en;q=0.8",
              # 同意画面を飛ばす（ヨーロッパの IP から実行されたとき用）
              "Cookie": "SOCS=CAISNQgQEitib3FfaWRlbnRpdHlmcm9udGVuZHVpc2VydmVyXzIwMjQwMzE3LjA5X3AwGgJlbiADGgYIgLC_rwY",
          }


          def _varint(n):
              out = b""
              while True:
                  b, n = n & 0x7F, n >> 7
                  out += bytes([b | (0x80 if n else 0)])
                  if not n:
                      return out


          def _pb_bytes(num, payload):
              if isinstance(payload, str):
                  payload = payload.encode()
              return _varint(num << 3 | 2) + _varint(len(payload)) + payload


          def _pb_int(num, n):
              return _varint(num << 3) + _varint(n)


          def gf_url(origin, dest, dep, ret=None):
              """Google Flights の検索結果ページの URL（origin/dest は TYO・SEL のような都市コードでよい）。"""
              def seg(date, a, b):
                  return _pb_bytes(3, _pb_bytes(2, date) + _pb_bytes(13, _pb_int(1, 1) + _pb_bytes(2, a)) + _pb_bytes(14, _pb_int(1, 1) + _pb_bytes(2, b)))
              body = seg(dep, origin, dest) + (seg(ret, dest, origin) if ret else b"")
              body += _pb_int(8, 1) + _pb_int(9, 1) + _pb_int(19, 1 if ret else 2)   # 大人1・エコノミー・往復/片道
              return f"{GF_URL}?tfs={base64.urlsafe_b64encode(body).decode().rstrip('=')}&hl=ja&gl=JP&curr=JPY"


          def gf_search(origin, dest, dep, ret=None):
              """Google Flights でその日付の最安便を調べる。便が無ければ price は None。ページが読めなければ例外。"""
              req = urllib.request.Request(gf_url(origin, dest, dep, ret), headers=GF_HEADERS)
              with urllib.request.urlopen(req, timeout=30) as res:
                  page = res.read().decode("utf-8", "replace")
              data = None
              for m in re.finditer(r"AF_initDataCallback\((\{.*?\})\);", page, re.S):   # 検索結果はページ内の ds:1 に入っている
                  if re.search(r"key:\s*'ds:1'", m.group(1)):
                      d = re.search(r"data:(.*?), sideChannel", m.group(1), re.S)
                      data = json.loads(d.group(1)) if d else None
                      break
              if not isinstance(data, list):
                  raise RuntimeError("検索結果の入っていないページが返ってきた")
              out = {"price": None}
              for idx in (2, 3):                                     # 2 = おすすめの便、3 = その他の便
                  try:
                      rows = data[idx][0] or []
                  except (IndexError, TypeError):
                      continue
                  for row in rows:
                      try:
                          price, legs = row[1][0][-1], row[0][2]
                          if isinstance(price, bool) or not isinstance(price, (int, float)) or price <= 0:
                              continue
                          if out["price"] is None or price < out["price"]:
                              t = list(legs[0][8] or []) + [0, 0]
                              out.update(price=int(price), air=f"{legs[0][22][0]}{legs[0][22][1]}", src=legs[0][3], dst=legs[-1][6],
                                         stops=len(legs) - 1, time=f"{t[0] or 0:02d}:{t[1] or 0:02d}")
                      except (IndexError, TypeError):
                          continue
              try:                                                   # Google が出している「この路線の通常の価格帯」
                  out["low"], out["high"] = int(data[5][4][1]), int(data[5][5][1])
              except (IndexError, TypeError, ValueError):
                  pass
              return out


          def gf_fill(cache, wanted, now):
              """wanted = {(出発地, 行先, 往路日, 復路日): 優先度} を、通知ラインに近い順に Google Flights で調べて cache に入れる。"""
              todo = sorted((pri, k) for k, pri in wanted.items() if "|".join(k) not in cache)
              done = fails = 0
              for _, k in todo:
                  if done >= GF_MAX_FETCH or fails >= 3:             # 3回続けて失敗したら、今回はあきらめる（Aviasales の価格だけで続行）
                      break
                  origin, dest, dep, ret = k
                  done += 1
                  try:
                      cache["|".join(k)] = {"at": now.isoformat(), **gf_search(origin, dest, dep, ret or None)}
                      fails = 0
                  except Exception as e:
                      fails += 1
                      print(f"[warn] Google Flights（{origin}→{dest} {dep}）の取得に失敗: {e}")
                  time.sleep(1)
              print(f"Google Flights で確認: 候補 {len(wanted)} 件 / 今回調べた {done} 件 / 次回に回す {len(todo) - done} 件")


          def fetch_sales(state, feed=SALE_FEED, key="sales_seen", keep=None):
              """RSS から、まだ通知していない記事を返す。keep(title) が False の記事は捨てる。"""
              req = urllib.request.Request(feed, headers={"User-Agent": "Mozilla/5.0 (flight-alert/1.0)"})
              with urllib.request.urlopen(req, timeout=30) as res:
                  root = ET.fromstring(res.read())
              now = datetime.now(JST)
              first = key not in state
              seen = state.setdefault(key, {})
              cut = (now - timedelta(days=SALE_KEEP_DAYS)).isoformat()
              for k in [k for k, t in seen.items() if t < cut]:
                  del seen[k]
              new = []
              for item in root.iter("item"):
                  title, link = (item.findtext("title") or "").strip(), (item.findtext("link") or "").strip()
                  if not link or link in seen:
                      continue
                  seen[link] = now.isoformat()
                  if first:
                      continue                                  # 初回は既存記事を既読にするだけ
                  if keep is None and SALE_NEED_PRICE and "円" not in title:
                      continue
                  if keep is not None and not keep(title):
                      continue
                  new.append({"title": title, "url": link})
              return new


          def load_state():
              if os.path.exists(STATE_FILE):
                  with open(STATE_FILE, encoding="utf-8") as f:
                      return json.load(f)
              return {}


          def save_state(state):
              with open(STATE_FILE, "w", encoding="utf-8") as f:
                  json.dump(state, f, ensure_ascii=False, indent=1, sort_keys=True)
                  f.write("\n")


          def fmt_date(iso):
              try:
                  if "T" not in iso:                         # 日付だけのデータ（時刻なし）
                      d = datetime.fromisoformat(iso)
                      return d.strftime("%m/%d(") + "月火水木金土日"[d.weekday()] + ")"
                  d = datetime.fromisoformat(iso.replace("Z", "+00:00")).astimezone(JST)
                  return d.strftime("%m/%d(") + "月火水木金土日"[d.weekday()] + d.strftime(") %H:%M")
              except Exception:
                  return iso or "-"


          def fmt_transfers(n):
              return "直行" if not n else f"乗継{n}回"


          def pick_deals(items, state, cities):
              """通知すべき便を選ぶ。state も更新する。"""
              now = datetime.now(JST)
              today = now.date().isoformat()
              history = state.setdefault("history", {})     # 行先 → {日付: その日の最安値}
              notified = state.setdefault("notified", {})   # 通知済みキー → 通知日時

              # 古い記録を掃除
              cutoff = (now - timedelta(days=HISTORY_DAYS)).date().isoformat()
              for dest in list(history):
                  history[dest] = {d: p for d, p in history[dest].items() if d >= cutoff}
                  if not history[dest]:
                      del history[dest]
              re_cut = (now - timedelta(days=RENOTIFY_DAYS)).isoformat()
              for k in list(notified):
                  v = notified[k]
                  if isinstance(v, str):                    # 旧形式「行先|往路|復路|価格」→ 新形式へ
                      del notified[k]
                      k2, _, p = k.rpartition("|")
                      if v >= re_cut and (k2 not in notified or int(p) < notified[k2]["price"]):
                          notified[k2] = {"at": v, "price": int(p)}
                  elif v["at"] < re_cut:
                      del notified[k]

              gf_cache = state.setdefault("gf", {})          # Google Flights で調べた結果（出発地|行先|往路日|復路日 → 価格など）
              gf_cut = (now - timedelta(hours=GF_CACHE_HOURS)).isoformat()
              for k in [k for k, v in gf_cache.items() if v["at"] < gf_cut]:
                  del gf_cache[k]

              # 出発地・行先・片道/往復ごとに、日付別の最安便を安い順に並べる（先頭が今回の最安便）
              groups = {}
              for it in items:
                  dest, price = it.get("destination"), it.get("price")
                  origin, ow = it.get("_origin", ORIGIN), it.get("_ow", False)
                  if not dest or not isinstance(price, (int, float)) or bool(it.get("return_at")) == ow:
                      continue
                  dates = ((it.get("departure_at") or "")[:10], (it.get("return_at") or "")[:10])
                  g = groups.setdefault((origin, dest, ow), {})
                  if dates not in g or price < g[dates]["price"]:
                      g[dates] = it
              groups = {k: sorted(g.values(), key=lambda it: it["price"]) for k, g in groups.items()}
              best = {k: g[0] for k, g in groups.items()}

              # 東京→地方の空港までの移動費（東京発データのその都市行き最安。往復なら往復分）
              positioning = {(dest, ow): int(it["price"]) for (o, dest, ow), it in best.items() if o == ORIGIN and dest in REGIONAL}

              # 1) 行先ごとの通知ラインを出し、Google Flights でも調べる便を集める
              plans, wanted = [], {}
              for (origin, dest, ow), group in groups.items():
                  country = cities.get(dest, ("", ""))[1]
                  extra = 0
                  if origin != ORIGIN:
                      if country == "JP" or (origin, ow) not in positioning:
                          continue                              # 地方発の国内線、移動費が分からない便は対象外
                      extra = positioning[(origin, ow)]
                  # 履歴のキー（東京発・往復は従来どおり行先コードのみ）
                  hkey = dest if origin == ORIGIN and not ow else f"{origin}-{dest}" + (":OW" if ow else "")
                  past = sorted(p for d, p in history.get(hkey, {}).items() if d != today)
                  baseline = past[len(past) // 2] if len(past) >= BASELINE_MIN_DAYS else None
                  cap = HAWAII_CAP if dest in HAWAII else PRICE_CAPS.get(country, 0)
                  if ow:
                      cap = int(cap * ONE_WAY_RATE)
                  line = max(cap, baseline * (1 - BASELINE_RATE) if baseline else 0)   # この金額以下なら通知になる
                  cands = []
                  if GF_ENABLED and line:
                      for it in group[:GF_TOP_DATES]:
                          dep, ret = (it.get("departure_at") or "")[:10], (it.get("return_at") or "")[:10]
                          if dep and int(it["price"]) + extra <= line * GF_MARGIN:
                              k = (origin, dest, dep, ret)
                              cands.append((it, "|".join(k)))
                              wanted[k] = min(wanted.get(k, 9), (int(it["price"]) + extra) / line)
                  plans.append((origin, dest, ow, group, extra, hkey, past, baseline, cap, cands))
              if wanted:
                  gf_fill(gf_cache, wanted, now)

              # 2) Aviasales と Google Flights の安い方で判定する
              deals = []
              for origin, dest, ow, group, extra, hkey, past, baseline, cap, cands in plans:
                  it, gf = group[0], None
                  fare = int(it["price"])
                  for cand, gkey in cands:
                      g = gf_cache.get(gkey)
                      if not g:
                          continue                              # まだ調べられていない
                      f = min(int(cand["price"]), g["price"]) if g["price"] else int(cand["price"])
                      if gf is None or f < fare:                # 調べた便を優先し、その中でいちばん安い日付を選ぶ
                          it, gf, fare = cand, g, f
                  it = dict(it)
                  price = fare + extra
                  it["_avia"], it["_gf"] = int(it["price"]), gf
                  it["_fare"], it["_extra"], it["price"] = fare, extra, price

                  kind = "片道" if ow else "往復"
                  reasons = []
                  if cap and price <= cap:
                      reasons.append(f"{kind} ¥{cap:,} 以下（この地域の激安ライン）")
                  if baseline and price <= baseline * (1 - BASELINE_RATE):
                      reasons.append(f"普段の最安 ¥{baseline:,}（過去{len(past)}日の中央値）より {round((1 - price / baseline) * 100)}% 安い")
                  tyo = best.get((ORIGIN, dest, ow))
                  if reasons and origin != ORIGIN and tyo and price < tyo["price"]:
                      reasons.append(f"東京発の最安 ¥{int(tyo['price']):,} より ¥{int(tyo['price']) - price:,} 安い")
                  if reasons and gf and gf.get("low") and gf["price"] and gf["price"] < gf["low"]:   # Google 自身の価格が安いときだけ
                      reasons.append(f"Google Flights の通常の価格帯（¥{gf['low']:,}〜¥{gf['high']:,}）より安い")

                  # 履歴を更新（その日の最安値を保持）
                  day = history.setdefault(hkey, {})
                  day[today] = min(day.get(today, price), price)

                  if not reasons:
                      continue
                  key = f"{hkey}|{it.get('departure_at', '')[:10]}|{(it.get('return_at') or '')[:10]}"
                  if key in notified and price > notified[key]["price"] * (1 - RENOTIFY_DROP):
                      continue
                  deals.append((price, key, it, reasons))

              deals.sort(key=lambda x: x[0])
              deals = deals[:MAX_NOTIFY]
              for price, key, _, _ in deals:
                  notified[key] = {"at": now.isoformat(), "price": price}
              return [(it, reasons) for _, _, it, reasons in deals]


          def build_embed(it, reasons, cities, countries):
              dest = it["destination"]
              city, cc = cities.get(dest, (dest, ""))
              country = countries.get(cc, cc)
              place = f"{city}（{country}）" if country and cc != "JP" else city
              origin, ow = it.get("_origin", ORIGIN), it.get("_ow", False)
              kind = "片道" if ow else "往復"
              dep, ret = (it.get("departure_at") or "")[:10], (it.get("return_at") or "")[:10]
              link = it.get("link") or ""
              if link.startswith("/"):
                  avia_url = "https://www.aviasales.com" + link
              else:                                          # リンクが無いデータは検索結果ページを開く
                  back = "" if ow else f"{ret[8:10]}{ret[5:7]}"
                  avia_url = f"https://www.aviasales.com/search/{origin}{dep[8:10]}{dep[5:7]}{dest}{back}1" if dep and (ow or ret) else None
              google_url = gf_url(origin, dest, dep, ret or None) if dep and (ow or ret) else None
              gf, avia = it.get("_gf"), it.get("_avia", it.get("_fare", it["price"]))
              by_google = bool(gf and gf.get("price") and gf["price"] <= avia)   # Google Flights の方が安い（同額を含む）

              if by_google:                                  # 便の情報も Google Flights のものを出す
                  out_text = f"{fmt_date(dep)} {gf['time']}\n{gf['src']}→{gf['dst']}・{fmt_transfers(gf['stops'])}"
                  back_text, airline = fmt_date(ret), gf["air"]
              else:
                  out_text = f"{fmt_date(it.get('departure_at'))}\n{it.get('origin_airport', '') + '→' + it.get('destination_airport', '') + '・' if it.get('origin_airport') else ''}{fmt_transfers(it.get('transfers'))}"
                  back_text = f"{fmt_date(it.get('return_at'))}\n{fmt_transfers(it.get('return_transfers'))}"
                  airline = f"{it.get('airline', '-')} {it.get('flight_number', '')}".strip()
              fields = [{"name": "往路", "value": out_text, "inline": True}]
              if not ow:
                  fields.append({"name": "復路", "value": back_text, "inline": True})
              fields.append({"name": "航空会社", "value": airline, "inline": True})
              if origin == ORIGIN:
                  title = f"✈️ 東京 → {place}　{kind} ¥{int(it['price']):,}"
              else:
                  oname = cities.get(origin, (origin, ""))[0]
                  title = f"✈️ {oname}発 → {place}　{kind} 合計 ¥{int(it['price']):,}"
                  fields.append({"name": "内訳", "value": f"東京→{oname}（{kind}・国内線の最安目安） ¥{it['_extra']:,}\n{oname}発の運賃 ¥{it['_fare']:,}\n※国内線は別に予約。日付が合う便か確認してください", "inline": False})

              # 同じ日付での Aviasales と Google Flights の価格（地方発は、その空港からの運賃どうしを比べる）
              g_link = f"[Google Flights]({google_url})" if google_url else "Google Flights"
              a_link = f"[Aviasales]({avia_url})" if avia_url else "Aviasales"
              if by_google:
                  compare = f"{g_link} ¥{gf['price']:,} ← 安い方\n{a_link} ¥{avia:,}"
              elif gf and gf.get("price"):
                  compare = f"{a_link} ¥{avia:,} ← 安い方\n{g_link} ¥{gf['price']:,}"
                  if gf["price"] > avia * GF_STALE_RATE:
                      compare += "\n⚠️ 差が大きいので、Aviasales の価格は古い可能性があります"
              elif gf:
                  compare = f"{a_link} ¥{avia:,}\n{g_link} にはこの日付の便が出ていません"
              else:
                  compare = f"{a_link} ¥{avia:,}\n{g_link} は未確認"
              fields.append({"name": "価格の比較（同じ日付）", "value": compare, "inline": False})
              fields.append({"name": "通知理由", "value": "\n".join(reasons), "inline": False})
              embed = {
                  "title": title[:256],
                  "color": 0x2ECC71 if cc == "JP" else (0x9B59B6 if origin != ORIGIN else 0x3498DB),
                  "fields": fields,
                  "footer": {"text": "燃油サーチャージ・税込みの大人1名の価格です。預け荷物・座席指定・支払手数料は別。\n価格は取得した時点のものです。予約前にリンク先で最新価格を確認してください。"},
              }
              url = google_url if by_google else avia_url
              if url:
                  embed["url"] = url
              return embed


          def post_discord(webhook, payload):
              body = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(webhook, data=body, headers={"Content-Type": "application/json", "User-Agent": "flight-alert/1.0"})
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=30):
                          return
                  except urllib.error.HTTPError as e:
                      if e.code == 429 and attempt < 2:  # レート制限 → 待って再送
                          time.sleep(float(e.headers.get("Retry-After", "2")))
                          continue
                      raise


          def main():
              token = os.environ.get("TRAVELPAYOUTS_TOKEN", "").strip()
              webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
              if not token or not webhook:
                  sys.exit("TRAVELPAYOUTS_TOKEN と DISCORD_WEBHOOK_URL を設定してください。")

              state = load_state()
              first_run = not state.get("started_at")

              cities, countries = load_names()
              items = []
              for origin in [ORIGIN] + REGIONAL:
                  for one_way in (False, True):
                      label = f"{origin}・{'片道' if one_way else '往復'}"
                      try:
                          got = fetch_prices(token, origin, one_way)
                          print(f"取得件数（日付別 {label}）: {len(got)}")
                          items.extend(got)
                      except Exception as e:
                          if origin == ORIGIN and not one_way:
                              raise                         # 本体のデータが取れないときは失敗にする
                          print(f"[warn] {label} の価格の取得に失敗: {e}")
                      try:
                          latest = fetch_latest(token, origin, one_way)
                          print(f"取得件数（直近48時間 {label}）: {len(latest)}")
                          items.extend(latest)
                      except Exception as e:                # 追加データなので失敗しても続行
                          print(f"[warn] 直近48時間の価格（{label}）の取得に失敗: {e}")
              deals = pick_deals(items, state, cities)
              print(f"通知件数: {len(deals)}")

              if first_run:
                  state["started_at"] = datetime.now(JST).isoformat()
                  post_discord(webhook, {"content": f"🛫 航空券ウォッチを開始しました（東京発・往復・{len(items)}件のデータを取得）。"})

              if deals:
                  embeds = [build_embed(it, r, cities, countries) for it, r in deals]
                  post_discord(webhook, {"content": f"格安往復航空券が {len(deals)} 件見つかりました。", "embeds": embeds})

              try:
                  sales = fetch_sales(state)
                  print(f"新着セール記事: {len(sales)}")
                  if sales:
                      embeds = [{"title": f"🏷️ {s['title']}"[:256], "url": s["url"], "color": 0xE67E22} for s in sales[:10]]
                      post_discord(webhook, {"content": f"航空会社のセール情報が {len(sales)} 件あります（トライシー）。", "embeds": embeds})
              except Exception as e:
                  print(f"[warn] セール記事の取得に失敗: {e}")

              try:
                  import html
                  deals_jp = fetch_sales(state, DEAL_FEED, "deals_seen", lambda t: bool(DEAL_JP_RE.search(html.unescape(t))) and "cruise" not in t.lower())
                  print(f"新着・日本発の激安/エラー運賃記事: {len(deals_jp)}")
                  if deals_jp:
                      embeds = []
                      for d in deals_jp[:10]:
                          t = html.unescape(d["title"])
                          hot = bool(DEAL_HOT_RE.search(t))
                          embeds.append({"title": f"{'🚨 エラー運賃 ' if hot else '💸 '}{t}"[:256], "url": d["url"], "color": 0xE74C3C if hot else 0xF1C40F,
                                         "footer": {"text": "海外サイトの記事（ユーロ表記）。エラー運賃はすぐ消えるので早めに確認を。"}})
                      post_discord(webhook, {"content": f"日本発の激安・エラー運賃情報が {len(deals_jp)} 件あります（Travel-Dealz）。", "embeds": embeds})
              except Exception as e:
                  print(f"[warn] 激安運賃記事の取得に失敗: {e}")

              save_state(state)


          if __name__ == "__main__":
              main()
          PYEOF

      - name: 航空券をチェック
        run: python3 check_flights.py
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: 記録を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
